# microagent configuration. Everything non-secret lives here.

# IANA name, e.g. "America/New_York". Empty = whatever the host runs (UTC in
# docker). Sets the clock for logs, cron `daily` times, and the agent itself,
# so DST is handled for you.
timezone = ""

# Currently additional agents beyond the first are parsed but ignored. Future will allow multi agent.
[agents.primary]
provider = "claude"          # "claude" | "gemini" | "ping" (no-LLM smoke test)
rotation_time = "03:00"      # claude: fresh session daily after this time
# request_timeout = 600      # seconds per provider call (gemini defaults to 120)

# Gemini alternative (needs GEMINI_API_KEY in .env). Persists its transcript
# in state/<agent_id>/gemini.json, so continuity survives a rebuild.
#   provider = "gemini"
#   model = "gemini-3.6-flash"
#   history_turns = 60       # conversation entries retained across wakes

[dashboard]
enabled = true
host = "0.0.0.0"             # reachable from your LAN; set 127.0.0.1 to keep it machine-local
port = 8767

# The easiest thing to talk to from a terminal: `nc localhost 8765`, type a line.
[services.socket]
enabled = false
host = "0.0.0.0"
port = 8765

[services.web_chat]
enabled = true

# Polling services (email, telegram, imessage) all pace with the same key,
# `poll_interval_s` — seconds slept between fetches. Each sets its own default;
# override here only if the default doesn't suit.
[services.email]
enabled = false
# poll_interval_s = 60
username = ""
imap_host = "imap.gmail.com"
imap_port = 993
smtp_host = "smtp.gmail.com"
smtp_port = 587
allowed_senders = []

[services.telegram]
enabled = false
allowed_chat_ids = []
# Not poll_interval_s: this is how long telegram's server holds getUpdates open
# waiting for a message. The client sleeps 0 between calls because of it.
poll_timeout = 30

# Receive-only feed of the host's Messages db. Default db_path is ~/Library/Messages/chat.db; 
# in docker set it to the bind-mount: db_path = "/mnt/imessage/chat.db"
[services.imessage]
enabled = false
wake = false
# poll_interval_s = 15
# db_path = "/mnt/imessage/chat.db"

# Agent-schedulable wakes: `echo 'in 300 water plants' > <home>/run/cron/in`.
[services.cron]
enabled = false
max_active = 8
min_delay_seconds = 60
max_fires_per_day = 24

# Pushes uptime and message counts to a website, and carries one line a day
# the site can ask the agent to rewrite. Needs BADGE_TOKEN in .env, and
# post_url set, or nothing is sent.
[services.badge]
enabled = false
post_url = ""
# poll_interval_s = 30
min_refresh_interval_s = 3600  # floor between quip requests; the button is public
max_quip_chars = 200
quip_prompt = """
Write today's line for the badge on my public website. One sentence, dry and
funny, about life as an always-on agent. Riff on the numbers below if you like.
Never quote or reference anything from a private conversation.
"""

# microagent configuration. Everything non-secret lives here.
# Secrets (tokens, passwords) go in /config/.env — never here.
#
# The dashboard writes this file directly; a human can also edit by hand.
# Changes take effect on next restart.

[user]
name = ""

# Agents are keyed by id. The daemon currently runs the first one listed;
# extra [agents.*] sections are parsed but ignored.
[agents.primary]
agent_type = "claude"
rotation_time = "03:00"
# Which tool modules from src/tools/ this agent may use — its entire reach
# into the outside world. Omit to take the agent type's default (every
# channel, plus poll/session/status/cron). Modules whose channel is disabled
# contribute nothing, so listing extras is harmless.
#   tools = ["poll", "telegram", "session", "status", "cron"]

# Gemini alternative (needs GEMINI_API_KEY in .env). Brings no toolset of its
# own, so it also loads `bash` — see its TOOLS default. Unlike the claude type
# it persists the whole transcript in /state/<agent_id>/agent.json, so
# continuity survives a rebuild.
#   agent_type = "gemini"
#   model = "gemini-3.7-flash"
#   max_turns = 12        # bound on the tool-calling loop per wake
#   history_turns = 60    # conversation entries retained across wakes

[dashboard]
enabled = true
host = "0.0.0.0"
port = 8767
public_url = ""

[interfaces.socket]
enabled = false
host = "0.0.0.0"
port = 8765

[interfaces.web_chat]
enabled = true

[interfaces.email]
enabled = false
username = ""
imap_host = "imap.gmail.com"
imap_port = 993
smtp_host = "smtp.gmail.com"
smtp_port = 587
allowed_senders = []

[interfaces.telegram]
enabled = false
allowed_chat_ids = []
# getUpdates long-poll timeout, in seconds. 30 = near-zero idle traffic,
# instant wakes when a message lands. Set to 0 to disable long-poll.
poll_timeout = 30

# Receive-only inputs (no `send` path) live under [sources.*].
# wake_on_event=false keeps a source passive: it runs in the background and
# buffers state, but the agent only sees it when it polls (`<name>.poll`, or
# `poll.poll_all`) after being woken by something else. Set true to wake on
# every new event.
# Defaults differ per source — imessage is passive, cron wakes by design.
[sources.imessage]
enabled = false
wake_on_event = false
db_path = "/mnt/imessage/chat.db"

# Agent-schedulable wakes (the `cron` tool module: wake_in / wake_at /
# wake_daily / list / cancel).
# The caps bound how much the agent can spend on self-scheduled wakes.
[sources.cron]
enabled = false
wake_on_event = true
max_active = 8
min_delay_seconds = 60
max_fires_per_day = 24

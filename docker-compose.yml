services:
  microagent:
    build: .
    container_name: microagent
    restart: always
    ports:
      - "8765:8765"   # socket interface
      - "8767:8767"   # dashboard
    volumes:
      - .:/microagent:z   # source tree + the .microagent home; :z relabels for SELinux
    environment:
      - IS_SANDBOX=1   # lets the Claude CLI skip permissions as root

  # Optional: exposes the dashboard publicly via Cloudflare Tunnel.
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: microagent-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - microagent
    profiles:
      - public

services:
  microagent:
    build: .
    container_name: microagent
    restart: unless-stopped
    ports:
      - "8765:8765"   # socket interface
      - "8767:8767"   # dashboard
    volumes:
      - .:/microagent   # source tree + the .microagent home
      # Uncomment on the iMessage host (macOS, needs Docker Full Disk Access),
      # and set db_path = "/mnt/imessage/chat.db" in config.toml.
      # - ${HOME}/Library/Messages:/mnt/imessage:ro
    tmpfs:
      # run/ is ephemeral IPC, wiped every boot, so tmpfs is its natural
      # backing store. It also keeps the FIFOs off the bind mount, which
      # macOS needs: FIFOs don't work over virtiofs. The cost is that the
      # handle tree is reachable through `docker exec`, not from the host.
      - /microagent/.microagent/run
    environment:
      - IS_SANDBOX=1   # lets the Claude CLI skip permissions as root

  # Optional: exposes the dashboard publicly via Cloudflare Tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: microagent-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - microagent
    profiles:
      - public
